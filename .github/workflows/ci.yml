name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_ADMIN_URL: postgresql://cms:cms@localhost:5432/cms?schema=public
  DATABASE_URL: postgresql://cms_app:cms_app@localhost:5432/cms?schema=public
  JWT_SECRET: ci-secret-key-that-is-at-least-32-characters-long
  PASSWORD_PWNED_CHECK: 'false'
  COOKIE_SECURE: 'false'
  COOKIE_DOMAIN: ''
  SMTP_HOST: localhost
  SMTP_PORT: '1025'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_DB: cms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cms" --health-interval 5s
          --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build shared package
        run: npm run build --workspace @cms/shared

      - name: Permission matrix tests
        run: npm test --workspace @cms/shared

      - name: Generate Prisma client
        run: npm run db:generate --workspace @cms/api

      - name: Apply migrations
        run: npm run db:deploy --workspace @cms/api

      # The application connects as an unprivileged role so RLS actually
      # applies to it. Without this step the isolation suite would pass for the
      # wrong reason — as the table owner, every policy is bypassed.
      - name: Apply row-level security policies
        run: npm run db:rls --workspace @cms/api

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Typecheck API
        run: npm run build --workspace @cms/api

      - name: Typecheck and build admin portal
        run: npm run build --workspace @cms/admin

      - name: Unit tests
        run: npm run test:unit --workspace @cms/api

      # §4.4 safeguard 5 and §18.2: "Tenant-isolation test suite in CI as a
      # merge blocker." This step failing must block the merge — do not add
      # continue-on-error to it.
      - name: Tenant isolation suite
        run: npm run test:isolation --workspace @cms/api

      # §11.9. Four bugs reached main because nothing drove a browser — including
      # one that broke every save after the access token expired, and one that
      # signed a user out for having two tabs open. Neither is visible to a unit
      # or API test, because the API was behaving correctly in both cases.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Emit OpenAPI document
        run: npm run openapi --workspace @cms/api

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: apps/api/openapi-admin.json

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # §18.2: automated dependency scanning in CI.
      - name: Audit dependencies
        run: npm audit --audit-level=high
